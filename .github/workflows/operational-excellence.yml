name: AL-0 Operational Excellence Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to check (1-4)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'

jobs:
  complexity-check:
    name: Complexity Monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests pillow
      
      - name: Run complexity check
        run: |
          python scripts/complexity_monitor.py
      
      - name: Upload complexity results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: complexity-results
          path: monitoring/complexity/

  docs-sync-check:
    name: Documentation Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Run docs sync check
        run: |
          python scripts/docs_sync_checker.py
      
      - name: Upload docs sync results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: docs-sync-results
          path: monitoring/docs_sync/

  phase-gate-check:
    name: Phase Gate Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests pillow
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Run phase gate check
        run: |
          python scripts/phase_gate_checker.py --phase ${{ github.event.inputs.phase || '1' }}
      
      - name: Upload phase gate results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: phase-gate-results
          path: monitoring/phase_gates/

  automated-metrics:
    name: Automated Metrics Tracking
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests pillow psutil GPUtil
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Run automated metrics tracking
        run: |
          python scripts/automated_metrics_tracker.py --compose-file docker-compose.mvp.yml --save
      
      - name: Upload metrics results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: automated-metrics-results
          path: monitoring/metrics/

  test-coverage-quality:
    name: Test Coverage Quality Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
      
      - name: Run test coverage quality analysis
        run: |
          python scripts/test_coverage_analyzer.py
      
      - name: Upload coverage results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-coverage-quality-results
          path: monitoring/test_coverage/

  progressive-feature-unlock:
    name: Progressive Feature Unlock Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install psutil GPUtil
      
      - name: Run progressive feature unlock analysis
        run: |
          python scripts/progressive_feature_unlock.py --save
      
      - name: Upload feature unlock results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: feature-unlock-results
          path: monitoring/feature_unlock/

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install safety bandit
      
      - name: Run security checks
        run: |
          # Check for known vulnerabilities
          safety check -r backend/requirements.txt
          safety check -r backend/requirements.mvp.txt
          
          # Check for security issues in code
          bandit -r backend/ -f json -o monitoring/security/bandit-results.json
      
      - name: Upload security results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-results
          path: monitoring/security/

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [complexity-check, docs-sync-check, phase-gate-check, automated-metrics, test-coverage-quality, progressive-feature-unlock, security-check]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Generate summary report
        run: |
          python scripts/generate_summary_report.py
      
      - name: Upload summary report
        uses: actions/upload-artifact@v3
        with:
          name: operational-excellence-summary
          path: monitoring/summary/
